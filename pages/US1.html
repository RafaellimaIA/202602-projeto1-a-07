<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff"><title>Assistente Bulbe</title><link rel="stylesheet" href="../assets/css/styleUS1T1.css">
</head>
<body>
<main class="phone-screen">
  <header class="brand-header" aria-label="Bulbe Energia"><div class="logo">bulbe<span class="logo-mark"><i></i><i></i><i></i></span></div></header>
  <section class="success-banner"><span>✓</span> Economia contratada com sucesso</section>
  <h1>Sua adesão foi realizada!</h1>
  <aside class="important-box"><strong>IMPORTANTE</strong><p>Confira se você recebeu uma mensagem de confirmação em seu WhatsApp.</p></aside>
  <div class="sheet-handle" aria-hidden="true"></div>
  <section class="chat" aria-label="Assistente virtual">
    <div class="chat-heading"><div><h2>Assistente Bulbe</h2><p>Atendimento virtual</p></div><button class="close-button" id="closeChat" type="button" aria-label="Fechar assistente">×</button></div>
    <div class="message-row"><div class="bot-avatar" aria-hidden="true"><span class="mini-logo"><i></i><i></i><i></i></span></div><div class="message-bubble">Olá! 👋<br>Sou o assistente virtual da Bulbe!<br>Como posso te ajudar?</div></div>
    <p class="message-time">14:32</p>
    <h3 class="faq-title">Dúvidas frequentes</h3>
    <div class="faq-list">
      <button class="faq-button" data-answer="Você pode acompanhar as próximas etapas nesta área. Se houver alguma pendência, siga as orientações apresentadas pela Bulbe."><span>Ver próximo passo da minha adesão</span><b>›</b></button>
      <button class="faq-button" data-answer="O prazo previsto para o início do desconto pode chegar a até 90 dias, conforme as informações apresentadas durante a adesão."><span>Quando o desconto começa?</span><b>›</b></button>
      <button class="faq-button" data-answer="Acompanhe o status da contratação pelos canais oficiais da Bulbe e confira as mensagens de atualização recebidas."><span>Acompanhar status da contratação</span><b>›</b></button>
      <button class="faq-button" data-answer="Para falar com um atendente, utilize o canal de atendimento oficial da Bulbe."><span>Falar com um atendente</span><b>›</b></button>
    </div>
    <div class="chat-response" id="chatResponse" role="status" aria-live="polite" hidden></div>
    <form class="message-form" id="messageForm"><input id="messageInput" type="text" placeholder="Digite sua mensagem..." autocomplete="off" aria-label="Digite sua mensagem"><button type="submit" aria-label="Enviar mensagem"><span class="send-icon"></span></button></form>
  </section>
</main><script src="../assets/js/US1T1.js"></script>
</body></html>
